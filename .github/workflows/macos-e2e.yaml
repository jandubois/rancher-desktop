name: e2e tests on macOS

on:
  workflow_dispatch:
  push:
    branches-ignore:
    - 'dependabot/**'
  pull_request: {}

jobs:
  check-paths:
    uses: ./.github/workflows/paths-ignore.yaml
  e2e-tests-macos:
    needs: check-paths
    if: needs.check-paths.outputs.should-run == 'true'
    timeout-minutes: 150
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - name: Run e2e Tests
        continue-on-error: false
        run: yarn test:e2e
        env:
          RD_DEBUG_ENABLED: '1'
          CI: true
        timeout-minutes: 150
      - name: Upload failure reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: failure-reports.zip
          path: ./e2e/reports/*
      - name: Clean up test environment
        run: |
          rm -f "$HOME/Library/Preferences/io.rancherdesktop.profile.defaults.plist"
          rm -f "$HOME/Library/Preferences/io.rancherdesktop.profile.locked.plist"
        if: always()
